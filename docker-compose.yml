services:
  postgres:
    image: postgres:16-alpine
    container_name: hybrid-athlete-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hybrid_athlete_ai_coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d hybrid_athlete_ai_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
